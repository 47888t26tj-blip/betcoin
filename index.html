<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>BetCoin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg:#0b0d12;
    --card:#161922;
    --card2:#1c202b;
    --border:#2a2f3b;
    --text:#fff;
    --muted:#9298a7;
    --accent:#2f80ff;
    --green:#25c06d;
    --red:#ff5252;
    --orange:#ff9f43;
    --gold:#ffd166;
}

html,
body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
}

body {
    padding-bottom:100px;
}

button,
input {
    font:inherit;
}

button {
    cursor:pointer;
}

.app {
    max-width:700px;
    margin:auto;
}

.page {
    display:none;
    padding:18px;
}

.page.active {
    display:block;
}

.topbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.brand {
    font-size:28px;
    font-weight:900;
}

.balance {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:10px 14px;
    font-weight:900;
}

.title {
    font-size:25px;
    font-weight:900;
    margin:0 0 18px;
}

.card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:15px;
    margin-bottom:12px;
}

.notice {
    color:var(--muted);
    font-size:13px;
}

.loader,
.empty {
    background:var(--card);
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:20px;
    padding:26px;
    text-align:center;
}

.search-box {
    width:100%;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    color:white;
    outline:none;
    margin-bottom:12px;
}

.search-box:focus {
    border-color:var(--accent);
}

.filters {
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:12px;
}

.filter-btn,
.league-btn,
.bet-filter {
    flex:0 0 auto;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:999px;
    padding:9px 13px;
    font-weight:800;
}

.filter-btn.active,
.league-btn.active,
.bet-filter.active {
    background:var(--accent);
    color:white;
    border-color:var(--accent);
}

.league-group {
    margin-bottom:12px;
}

.league-title {
    color:var(--muted);
    font-size:12px;
    font-weight:800;
    margin-bottom:8px;
}

.league-row {
    display:flex;
    gap:8px;
    overflow-x:auto;
}

.match-top {
    display:grid;
    grid-template-columns:1fr auto auto;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
}

.match-date {
    color:var(--muted);
    font-size:13px;
}

.league-label {
    border:1px solid var(--border);
    background:var(--card2);
    border-radius:999px;
    padding:5px 8px;
    font-size:11px;
}

.star-btn {
    width:38px;
    height:38px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--card2);
    color:var(--muted);
    font-size:21px;
}

.star-btn.active {
    color:var(--gold);
}

.teams {
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
}

.team {
    text-align:center;
    font-weight:800;
}

.team-logo {
    width:54px;
    height:54px;
    margin:0 auto 8px;
    border-radius:50%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.team-logo img {
    max-width:43px;
    max-height:43px;
}

.team-fav {
    margin-top:8px;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--muted);
    padding:6px 9px;
    font-size:11px;
}

.team-fav.active {
    color:var(--gold);
    border-color:rgba(255,209,102,.4);
}

.vs {
    color:var(--muted);
    font-size:12px;
}

.odds {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.odd {
    min-height:52px;
    border-radius:13px;
    background:var(--card2);
    border:1px solid var(--border);
    color:white;
    font-weight:900;
}

.odd.selected {
    border-color:var(--accent);
    background:rgba(47,128,255,.18);
}

.odd.disabled {
    opacity:.35;
    pointer-events:none;
}

.odd small {
    display:block;
    color:var(--muted);
    margin-bottom:3px;
}

.favorite-team-chip {
    display:inline-block;
    margin:4px;
    padding:7px 10px;
    border-radius:999px;
    color:var(--gold);
    border:1px solid rgba(255,209,102,.3);
    background:rgba(255,209,102,.08);
    font-size:12px;
    font-weight:800;
}

.market-title {
    font-size:18px;
    font-weight:900;
    margin:20px 0 10px;
}

.market-grid {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.market-grid.three {
    grid-template-columns:repeat(3,1fr);
}

.back {
    background:transparent;
    border:0;
    color:var(--accent);
    padding:0;
    margin-bottom:15px;
    font-size:17px;
}

.bottom-nav {
    position:fixed;
    z-index:50;
    left:0;
    right:0;
    bottom:0;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    min-height:80px;
    background:#12151d;
    border-top:1px solid var(--border);
}

.nav {
    background:transparent;
    border:0;
    color:var(--muted);
}

.nav.active {
    color:white;
}

.nav-icon {
    display:block;
    font-size:23px;
}

.nav-text {
    display:block;
    font-size:11px;
}

.tabs {
    display:grid;
    grid-template-columns:1fr 1fr;
    padding:4px;
    background:var(--card);
    border-radius:15px;
    margin-bottom:10px;
}

.tab {
    border:0;
    background:transparent;
    color:var(--muted);
    padding:10px;
    border-radius:12px;
}

.tab.active {
    background:var(--card2);
    color:white;
}

.status {
    display:inline-block;
    padding:5px 8px;
    border-radius:999px;
    font-size:11px;
    font-weight:900;
}

.status.active {
    color:var(--orange);
    background:rgba(255,159,67,.12);
}

.status.win {
    color:var(--green);
    background:rgba(37,192,109,.12);
}

.status.loss {
    color:var(--red);
    background:rgba(255,82,82,.12);
}

.status.refund {
    color:var(--muted);
}

.stat-grid {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.stat {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    padding:13px;
}

.stat-value {
    font-size:21px;
    font-weight:900;
}

.stat-name {
    color:var(--muted);
    font-size:11px;
}

.big-btn {
    width:100%;
    background:var(--accent);
    border:0;
    border-radius:14px;
    min-height:50px;
    color:white;
    font-weight:900;
    margin-top:10px;
}

.secondary {
    background:var(--card2);
}

.danger {
    background:rgba(255,82,82,.13);
    color:var(--red);
}

.input {
    width:100%;
    padding:14px;
    background:#0e1117;
    color:white;
    border:1px solid var(--border);
    border-radius:14px;
    outline:none;
}

.overlay {
    position:fixed;
    z-index:100;
    inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:flex-end;
}

.overlay.show {
    display:flex;
}

.modal {
    width:100%;
    max-width:700px;
    margin:auto;
    background:#151820;
    border-radius:25px 25px 0 0;
    border:1px solid var(--border);
    padding:20px;
    max-height:90vh;
    overflow:auto;
}

.parlay-float {
    display:none;
    position:fixed;
    z-index:45;
    right:15px;
    bottom:95px;
    padding:13px 15px;
    border:0;
    border-radius:16px;
    background:var(--accent);
    color:white;
    font-weight:900;
}

.parlay-float.show {
    display:block;
}

.parlay-leg {
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:11px;
    margin-bottom:8px;
}

.xp-bar {
    height:10px;
    background:#0f1117;
    border-radius:999px;
    overflow:hidden;
    margin-top:10px;
}

.xp-fill {
    height:100%;
    background:var(--accent);
}

.task-row {
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
}

.task-btn {
    background:var(--accent);
    color:white;
    border:0;
    border-radius:11px;
    padding:8px 10px;
}

.task-btn:disabled {
    opacity:.4;
}

</style>
</head>

<body>

<div class="app">

<section
    id="page-home"
    class="page active"
>

    <div class="topbar">

        <div class="brand">

        </div>

            <span id="balanceHome">

    <div class="league-group">

>

<script>

const SERVER_URL =
    "https://betcoin-gu5c.onrender.com";

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();

const initData =
    tg.initData || "";


let balance = 0;

let matches = [];
let loadedMatches = {};

let bets = [];
let parlays = [];

let favoriteMatches =
    JSON.parse(
        localStorage.getItem(
            "betcoin_favorites"
        )
        ||
        "[]"
    );

let favoriteTeams =
    JSON.parse(
        localStorage.getItem(
            "betcoin_favorite_teams"
        )
        ||
        "[]"
    );

let parlaySlip = [];

let currentLeague = "top5";
let dateFilter = "all";
let searchQuery = "";

let currentBetFilter = "all";
let currentBetTab = "single";

let selectedBet = null;
let currentUser = null;

let profileXp = 0;
let profileLevel = 1;
let profileLeague = {};
let currentLevelXp = 0;
let profileStats = {};
let tasks = [];
let achievements = [];
let myRank = null;
let dailyReward = {};



function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function jsString(value) {

    return String(
        value ?? ""
    )
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n"," ");
}


async function post(
    path,
    body={}
) {

    const response =
        await fetch(
            SERVER_URL + path,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "X-Telegram-Init-Data":
                        initData
                },

                body:JSON.stringify({
                    ...body,
                    initData
                })
            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error
            ||
            "Ошибка сервера"
        );
    }


    return data;
}


function updateBalance() {

    [
        "balanceHome",
        "balanceMatches",
        "balanceBets",
        "balanceProfile"
    ].forEach(
        id => {

            const el =
                document.getElementById(
                    id
                );


            if (el) {

                el.textContent =
                    balance;
            }
        }
    );
}


function setFavoriteMatches(
    serverFavorites
) {

    if (
        !Array.isArray(
            serverFavorites
        )
    ) {

        return;
    }


    favoriteMatches =
        serverFavorites
        .map(
            item =>
                Number(
                    item.fixture_id
                )
        )
        .filter(
            Number.isFinite
        );


    localStorage.setItem(
        "betcoin_favorites",
        JSON.stringify(
            favoriteMatches
        )
    );
}


function setFavoriteTeams(
    serverTeams
) {

    if (
        !Array.isArray(
            serverTeams
        )
    ) {

        return;
    }


    favoriteTeams =
        serverTeams
        .map(
            String
        )
        .filter(Boolean);


    localStorage.setItem(
        "betcoin_favorite_teams",
        JSON.stringify(
            favoriteTeams
        )
    );
}


function teamKey(name) {

    return String(
        name || ""
    )
    .trim()
    .toLowerCase();
}


function isFavoriteTeam(name) {

    const key =
        teamKey(name);


    return favoriteTeams.some(
        team =>
            teamKey(team)
            ===
            key
    );
}


async function toggleFavoriteTeam(
    name
) {

    const wasFavorite =
        isFavoriteTeam(
            name
        );


    if (wasFavorite) {

        favoriteTeams =
            favoriteTeams.filter(
                team =>
                    teamKey(team)
                    !==
                    teamKey(name)
            );

    } else {

        favoriteTeams.push(
            name
        );
    }


    localStorage.setItem(
        "betcoin_favorite_teams",
        JSON.stringify(
            favoriteTeams
        )
    );


    renderMatches();
    renderHome();
    renderFavoriteTeamsBox();


    try {

        const data =
            await post(
                "/api/favorite-teams/toggle",
                {
                    team_name:name,
                    favorite:
                        !wasFavorite
                }
            );


        setFavoriteTeams(
            data.favorite_teams
            ||
            []
        );


        renderMatches();
        renderHome();
        renderFavoriteTeamsBox();


    } catch(error) {

        tg.showAlert(
            error.message
        );
    }
}


async function syncOldFavoriteTeams() {

    const key =
        "betcoin_team_sync_v1";


    if (
        localStorage.getItem(
            key
        )
        ===
        "1"
    ) {

    try {

                "/api/favorite-teams/sync",
                {
                    teams:
                        favoriteTeams
                }
            );


        setFavoriteTeams(
            data.favorite_teams
            ||
            []
        );


        localStorage.setItem(
            key,
            "1"

    }
}


async function toggleMatchFavorite(
    fixtureId
) {

    const id =
        Number(
            fixtureId
        );


    const was =
        favoriteMatches.includes(
            id
        );


    if (was) {

        favoriteMatches =
            favoriteMatches.filter(
                value =>
                    value !== id
            );

    } else {

        favoriteMatches.push(
            id
        );
    }


    localStorage.setItem(
        "betcoin_favorites",
        JSON.stringify(
            favoriteMatches
        )
    );


    renderMatches();
    renderHome();


    try {

        const data =
            await post(
                "/api/favorites/toggle",
                {
                    fixture_id:id,
                    favorite:
                        !was
                }
            );


        setFavoriteMatches(
            data.favorites
            ||
            []
        );


        renderMatches();
        renderHome();


    } catch(error) {

        tg.showAlert(
            error.message
        );
    }
}

async function loadLeague(
    leagueKey
) {

    currentLeague =
        leagueKey;


    document
    .querySelectorAll(
        ".league-btn"
    )
    .forEach(
        button => {

            button.classList.toggle(
                "active",
                button.dataset.league
                ===
                leagueKey
            );
        }
    );


    if (
        leagueKey
        ===
        "favorites"
    ) {

        renderMatches();

        return;
    }


    if (
        loadedMatches[
            leagueKey
        ]
    ) {

        matches =
            loadedMatches[
                leagueKey
            ];


        renderMatches();

        return;
    }


    document.getElementById(
        "matchesList"
    ).innerHTML = `
        <div class="loader">
            Загружаем матчи...
        </div>
    `;


    try {

        let url =
            SERVER_URL
            +
            "/api/matches";


        if (
            leagueKey
            !==
            "top5"
        ) {

            url +=
                "?league="
                +
                encodeURIComponent(
                    leagueKey
                );
        }


        const response =
            await fetch(
                url
            );


        const data =
            await response.json();


        if (
            !response.ok
            ||
            !data.success
        ) {

            throw new Error(
                data.error
                ||
                "Ошибка загрузки"
            );
        }


        matches =
            data.matches
            ||
            [];


        loadedMatches[
            leagueKey
        ] =
            matches;


        renderMatches();
        renderHome();


    } catch(error) {

        document.getElementById(
            "matchesList"
        ).innerHTML = `
            <div class="empty">
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;
    }
}


function selectLeague(key) {

    loadLeague(key);
}


function allLoadedMatches() {

    const result = {};


    Object.values(
        loadedMatches
    ).forEach(
        list => {

            (list || [])
            .forEach(
                match => {

                    result[
                        String(
                            match.fixture_id
                        )
                    ] =
                        match;
                }
            );
        }
    );


    return Object.values(
        result
    );
}


function formatDate(value) {

    if (!value) {
        return "";
    }


    return new Date(
        value
    ).toLocaleString(
        "ru-RU",
        {
            day:"2-digit",
            month:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


function isToday(value) {

    const date =
        new Date(value);


    const now =
        new Date();


    return (
        date.getFullYear()
        ===
        now.getFullYear()

        &&

        date.getMonth()
        ===
        now.getMonth()

        &&

        date.getDate()
        ===
        now.getDate()
    );
}


function isTomorrow(value) {

    const tomorrow =
        new Date();


    tomorrow.setDate(
        tomorrow.getDate()
        +
        1
    );


    const date =
        new Date(value);


    return (
        date.getFullYear()
        ===
        tomorrow.getFullYear()

        &&

        date.getMonth()
        ===
        tomorrow.getMonth()

        &&

        date.getDate()
        ===
        tomorrow.getDate()
    );
}


function matchHasFavoriteTeam(
    match
) {

    return (
        isFavoriteTeam(
            match.home
        )
        ||
        isFavoriteTeam(
            match.away
        )
    );
}


function filteredMatches(list) {

    let result =
        [...list];


    if (
        dateFilter ===
        "today"
    ) {

        result =
            result.filter(
                match =>
                    isToday(
                        match.date
                    )
            );
    }


    if (
        dateFilter ===
        "tomorrow"
    ) {

        result =
            result.filter(
                match =>
                    isTomorrow(
                        match.date
                    )
            );
    }


    if (
        dateFilter ===
        "myteams"
    ) {

        result =
            result.filter(
                match =>
                    matchHasFavoriteTeam(
                        match
                    )
            );
    }


    if (searchQuery) {

        result =
            result.filter(
                match =>
                    (
                        String(
                            match.home
                            ||
                            ""
                        )
                        +
                        " "
                        +
                        String(
                            match.away
                            ||
                            ""
                        )
                        +
                        " "
                        +
                        String(
                            match.league
                            ||
                            ""
                        )
                    )
                    .toLowerCase()
                    .includes(
                        searchQuery
                    )
            );
    }


    return result;
}


function changeSearch(value) {

    searchQuery =
        String(
            value
        )
        .toLowerCase()
        .trim();


    renderMatches();
}


function changeDateFilter(value) {

    dateFilter =
        value;


    document
    .querySelectorAll(
        ".filter-btn"
    )
    .forEach(
        button => {

            button.classList.toggle(
                "active",
                button.dataset.date
                ===
                value
            );
        }
    );


    renderMatches();
}


function teamLogo(
    url,
    name
) {

    if (!url) {

        return `
            <div class="team-logo">
                ⚽
            </div>
        `;
    }


    return `
        <div class="team-logo">

            <img
                src="${escapeHtml(url)}"
                alt="${escapeHtml(name)}"

                onerror="
                    this.parentElement.innerHTML='⚽';
                "
            >

        </div>
    `;
}


function oddButton(
    match,
    selection,
    odd,
    label
) {

    const number =
        Number(odd);


    if (
        !Number.isFinite(number)
        ||
        number <= 1
    ) {

        return `
            <button
                class="odd disabled"
            >
                <small>
                    ${escapeHtml(label)}
                </small>

                —
            </button>
        `;
    }


    const selected =
        parlaySlip.some(
            leg =>
                Number(
                    leg.fixture_id
                )
                ===
                Number(
                    match.fixture_id
                )
                &&
                leg.selection
                ===
                selection
        );


    return `
        <button
            class="
                odd
                ${selected ? "selected" : ""}
            "

            onclick="
                event.stopPropagation();

                selectBet(
                    ${Number(match.fixture_id)},
                    '${jsString(match.home)}',
                    '${jsString(match.away)}',
                    '${jsString(selection)}',
                    ${number}
                );
            "
        >

            <small>
                ${selected ? "✓ " : ""}
                ${escapeHtml(label)}
            </small>

            ${number.toFixed(2)}

        </button>
    `;
}


function renderMatch(
    match
) {

    const odds =
        match.odds
        ||
        {};


    const favorite =
        favoriteMatches.includes(
            Number(
                match.fixture_id
            )
        );


    return `
        <div
            class="card"
            onclick="
                openMatch(
                    ${Number(match.fixture_id)}
                )
            "
        >

            <div class="match-top">

                <div class="match-date">
                    ${formatDate(
                        match.date
                    )}
                </div>

                <div class="league-label">
                    ${escapeHtml(
                        match.league
                        ||
                        "Футбол"
                    )}
                </div>

                <button
                    class="
                        star-btn
                        ${favorite ? "active" : ""}
                    "

                    onclick="
                        event.stopPropagation();

                        toggleMatchFavorite(
                            ${Number(match.fixture_id)}
                        );
                    "
                >
                    ${favorite ? "★" : "☆"}
                </button>

            </div>

            <div class="teams">

                <div class="team">

                    ${teamLogo(
                        match.home_logo,
                        match.home
                    )}

                    <div>
                        ${escapeHtml(
                            match.home
                        )}
                    </div>

                    <button
                        class="
                            team-fav
                            ${
                                isFavoriteTeam(
                                    match.home
                                )
                                ?
                                "active"
                                :
                                ""
                            }
                        "

                        onclick="
                            event.stopPropagation();

                            toggleFavoriteTeam(
                                '${jsString(match.home)}'
                            );
                        "
                    >
                        ${
                            isFavoriteTeam(
                                match.home
                            )
                            ?
                            "★ Любимая"
                            :
                            "☆ В любимые"
                        }
                    </button>

                </div>

                <div class="vs">
                    VS
                </div>

                <div class="team">

                    ${teamLogo(
                        match.away_logo,
                        match.away
                    )}

                    <div>
                        ${escapeHtml(
                            match.away
                        )}
                    </div>

                    <button
                        class="
                            team-fav
                            ${
                                isFavoriteTeam(
                                    match.away
                                )
                                ?
                                "active"
                                :
                                ""
                            }
                        "

                        onclick="
                            event.stopPropagation();

                            toggleFavoriteTeam(
                                '${jsString(match.away)}'
                            );
                        "
                    >
                        ${
                            isFavoriteTeam(
                                match.away
                            )
                            ?
                            "★ Любимая"
                            :
                            "☆ В любимые"
                        }
                    </button>

                </div>

            </div>

            <div class="odds">

                ${oddButton(
                    match,
                    "П1",
                    odds.home,
                    "П1"
                )}

                ${oddButton(
                    match,
                    "X",
                    odds.draw,
                    "X"
                )}

                ${oddButton(
                    match,
                    "П2",
                    odds.away,
                    "П2"
                )}

            </div>

        </div>
    `;
}


function renderFavoriteTeamsBox() {

    const box =
        document.getElementById(
            "favoriteTeamsBox"
        );


    if (
        !favoriteTeams.length
    ) {

        box.innerHTML = "";

        return;
    }


    box.innerHTML = `
        <div class="card">

            <b>
                ⭐ Мои команды
            </b>

            <div style="margin-top:8px;">

                ${
                    favoriteTeams
                    .map(
                        team => `
                            <span
                                class="favorite-team-chip"

                                onclick="
                                    document.getElementById('search').value='${jsString(team)}';

                                    changeSearch(
                                        '${jsString(team)}'
                                    );
                                "
                            >
                                ${escapeHtml(team)}
                            </span>
                        `
                    )
                    .join("")
                }

            </div>

            <div
                class="notice"
                style="margin-top:8px;"
            >
                🔔 Бот напомнит примерно за 30 минут до матча любимой команды.
            </div>

        </div>
    `;
}


function renderMatches() {

    renderFavoriteTeamsBox();


    let list;


    if (
        currentLeague ===
        "favorites"
    ) {

        list =
            allLoadedMatches()
            .filter(
                match =>
                    favoriteMatches.includes(
                        Number(
                            match.fixture_id
                        )
                    )
            );

    } else {

        list =
            matches;
    }


    list =
        filteredMatches(
            list
        );


    document.getElementById(
        "matchesList"
    ).innerHTML =
        list.length
        ?
        list.map(
            renderMatch
        ).join("")
        :
        `
            <div class="empty">
                Матчи не найдены
            </div>
        `;
}


function renderHome() {

    const top =
        (
            loadedMatches.top5
            ||
            []
        )
        .slice(
            0,
            5
        );


    document.getElementById(
        "homeMatches"
    ).innerHTML =
        top.length
        ?
        top.map(
            renderMatch
        ).join("")
        :
        `
            <div class="empty">
                Нет матчей
            </div>
        `;


    const favoriteTeamMatches =
        allLoadedMatches()
        .filter(
            match =>
                matchHasFavoriteTeam(
                    match
                )
        )
        .slice(
            0,
            3
        );


    document.getElementById(
        "homeFavoriteTeams"
    ).innerHTML =
        favoriteTeamMatches.length
        ?
        `
            <h2>
                ⭐ Мои команды
            </h2>

            ${
                favoriteTeamMatches
                .map(
                    renderMatch
                )
                .join("")
            }
        `
        :
        "";
}


async function openMatch(
    fixtureId
) {

    showPage(
        "match",
        false
    );


    const detail =
        document.getElementById(
            "matchDetail"
        );


    detail.innerHTML = `
        <div class="loader">
            Загрузка...
        </div>
    `;


    try {

        const response =
            await fetch(
                SERVER_URL
                +
                "/api/match/"
                +
                fixtureId
            );


        const match =
            await response.json();


        if (!response.ok) {

            throw new Error(
                match.error
                ||
                "Ошибка"
            );
        }


        const odds =
            match.odds
            ||
            {};


        let html = `
            ${renderMatch(match)}

            <div class="market-title">
                Исход матча
            </div>

            <div class="market-grid three">

                ${oddButton(
                    match,
                    "П1",
                    odds.home,
                    "П1"
                )}

                ${oddButton(
                    match,
                    "X",
                    odds.draw,
                    "X"
                )}

                ${oddButton(
                    match,
                    "П2",
                    odds.away,
                    "П2"
                )}

            </div>
        `;


        [
            1.5,
            2.5,
            3.5,
            4.5
        ].forEach(
            line => {

                const key =
                    "total_"
                    +
                    String(
                        line
                    )
                    .replace(
                        ".",
                        "_"
                    );


                const total =
                    match[key];


                if (!total) {
                    return;
                }


                html += `
                    <div class="market-title">
                        Тотал ${line}
                    </div>

                    <div class="market-grid">

                        ${oddButton(
                            match,
                            `ТБ ${line}`,
                            total.over,
                            `ТБ ${line}`
                        )}

                        ${oddButton(
                            match,
                            `ТМ ${line}`,
                            total.under,
                            `ТМ ${line}`
                        )}

                    </div>
                `;
            }
        );


        if (match.btts) {

            html += `
                <div class="market-title">
                    Обе забьют
                </div>

                <div class="market-grid">

                    ${oddButton(
                        match,
                        "ОЗ Да",
                        match.btts.yes,
                        "Да"
                    )}

                    ${oddButton(
                        match,
                        "ОЗ Нет",
                        match.btts.no,
                        "Нет"
                    )}

                </div>
            `;
        }


        if (match.handicaps) {

            const home =
                Object.entries(
                    match.handicaps.home
                    ||
                    {}
                )[0];


            const away =
                Object.entries(
                    match.handicaps.away
                    ||
                    {}
                )[0];


            if (
                home
                &&
                away
            ) {

                html += `
                    <div class="market-title">
                        Фора
                    </div>

                    <div class="market-grid">

                        ${oddButton(
                            match,
                            `Ф1(${home[0]})`,
                            home[1],
                            `Ф1 (${home[0]})`
                        )}

                        ${oddButton(
                            match,
                            `Ф2(${away[0]})`,
                            away[1],
                            `Ф2 (${away[0]})`
                        )}

                    </div>
                `;
            }
        }


        detail.innerHTML =
            html;


    } catch(error) {

        detail.innerHTML = `
            <div class="empty">
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;
    }
}


function selectBet(
    fixtureId,
    home,
    away,
    selection,
    odd
) {

    const matchText =
        `${home} — ${away}`;


    const same =
        parlaySlip.findIndex(
            leg =>
                Number(
                    leg.fixture_id
                )
                ===
                Number(
                    fixtureId
                )
                &&
                leg.selection
                ===
                selection
        );


    if (same >= 0) {

        parlaySlip.splice(
            same,
            1
        );


        updateParlay();

        renderMatches();

        return;
    }


    selectedBet = {
        fixture_id:
            Number(
                fixtureId
            ),

        match:
            matchText,

        selection,

        odd:
            Number(odd)
    };


    document.getElementById(
        "singleInfo"
    ).innerHTML = `
        <b>
            ${escapeHtml(
                matchText
            )}
        </b>

        <div class="notice">
            ${escapeHtml(selection)}
            •
            ${Number(odd).toFixed(2)}
        </div>
    `;


    document.getElementById(
        "singleAmount"
    ).value =
        "";


    document.getElementById(
        "singleOverlay"
    ).classList.add(
        "show"
    );
}


function updateSingleWin() {

    const amount =
        Number(
            document.getElementById(
                "singleAmount"
            ).value
        );


    document.getElementById(
        "singleWin"
    ).textContent =
        selectedBet
        &&
        amount > 0
        ?
        `Возможный выигрыш: ${
            Math.round(
                amount
                *
                selectedBet.odd
            )
        } 🪙`
        :
        "";
}


async function confirmSingle() {

    const amount =
        Number(
            document.getElementById(
                "singleAmount"
            ).value
        );


    if (
        !selectedBet
        ||
        amount <= 0
    ) {

        return;
    }


    try {

        const data =
            await post(
                "/api/bets",
                {
                    fixture_id:
                        selectedBet.fixture_id,

                    selection:
                        selectedBet.selection,

                    amount:
                        Math.floor(
                            amount
                        )
                }
            );


        balance =
            Number(
                data.balance
            );


        bets =
            data.bets
            ||
            bets;


        updateBalance();
        renderBets();


        closeOverlay(
            "singleOverlay"
        );


        tg.showAlert(
            "Ставка принята ✅"
        );


    } catch(error) {

        tg.showAlert(
            error.message
        );
    }
}


function addToParlay(
    bet
) {

    if (
        parlaySlip.some(
            leg =>
                Number(
                    leg.fixture_id
                )
                ===
                Number(
                    bet.fixture_id
                )
        )
    ) {

        tg.showAlert(
            "Этот матч уже есть в экспрессе"
        );

        return;
    }


    parlaySlip.push(
        bet
    );


    updateParlay();
}


function updateParlay() {

    const float =
        document.getElementById(
            "parlayFloat"
        );


    float.textContent =
        `🧾 Экспресс • ${parlaySlip.length}`;


    float.classList.toggle(
        "show",
        parlaySlip.length > 0
    );
}


function openParlay() {

    const container =
        document.getElementById(
            "parlayList"
        );


    container.innerHTML =
        parlaySlip
        .map(
            (
                leg,
                index
            ) => `
                <div class="parlay-leg">

                    <b>
                        ${index + 1}.
                        ${escapeHtml(
                            leg.match
                        )}
                    </b>

                    <div class="notice">
                        ${escapeHtml(
                            leg.selection
                        )}
                        •
                        ${Number(
                            leg.odd
                        ).toFixed(2)}
                    </div>

                    <button
                        class="task-btn"
                        onclick="
                            parlaySlip.splice(
                                ${index},
                                1
                            );

                            openParlay();
                            updateParlay();
                        "
                    >
                        Удалить
                    </button>

                </div>
            `
        )
        .join("");


    document.getElementById(
        "parlayCount"
    ).textContent =
        parlaySlip.length;


    document.getElementById(
        "parlayOdd"
    ).textContent =
        parlaySlip
        .reduce(
            (
                total,
                leg
            ) =>
                total
                *
                Number(
                    leg.odd
                ),
            1
        )
        .toFixed(2);


    document.getElementById(
        "parlayOverlay"
    ).classList.add(
        "show"
    );
}


function updateParlayWin() {

    const amount =
        Number(
            document.getElementById(
                "parlayAmount"
            ).value
        );


    const odd =
        parlaySlip.reduce(
            (
                total,
                leg
            ) =>
                total
                *
                Number(
                    leg.odd
                ),
            1
        );


    document.getElementById(
        "parlayWin"
    ).textContent =
        amount > 0
        ?
        `Возможный выигрыш: ${
            Math.round(
                amount
                *
                odd
            )
        } 🪙`
        :
        "";
}


async function confirmParlay() {

    if (
        parlaySlip.length < 2
    ) {

        tg.showAlert(
            "Нужно минимум 2 события"
        );

        return;
    }


    const amount =
        Number(
            document.getElementById(
                "parlayAmount"
            ).value
        );


    if (amount <= 0) {
        return;
    }


    try {

        const data =
            await post(
                "/api/parlays",
                {
                    amount:
                        Math.floor(
                            amount
                        ),

                    legs:
                        parlaySlip.map(
                            leg => ({
                                fixture_id:
                                    leg.fixture_id,

                                selection:
                                    leg.selection
                            })
                        )
                }
            );


        balance =
            Number(
                data.balance
            );


        parlays =
            data.parlays
            ||
            parlays;


        parlaySlip =
            [];


        updateParlay();

        closeOverlay(
            "parlayOverlay"
        );


        renderBets();
        updateBalance();


        showPage(
            "bets"
        );


        switchBetTab(
            "parlay"
        );


        tg.showAlert(
            "Экспресс принят ✅"
        );


    } catch(error) {

        tg.showAlert(
            error.message
        );
    }
}


function clearParlay() {

    parlaySlip =
        [];


    updateParlay();


    closeOverlay(
        "parlayOverlay"
    );
}


function closeOverlay(id) {

    document.getElementById(
        id
    ).classList.remove(
        "show"
    );
}


function statusClass(status) {

    if (status === "Выиграла") {
        return "win";
    }


    if (status === "Проиграла") {
        return "loss";
    }


    if (status === "Возврат") {
        return "refund";
    }


    return "active";
}


function passesBetFilter(item) {

    if (
        currentBetFilter ===
        "all"
    ) {
        return true;
    }


    if (
        currentBetFilter ===
        "active"
    ) {
        return item.status === "Активна";
    }


    if (
        currentBetFilter ===
        "win"
    ) {
        return item.status === "Выиграла";
    }


    if (
        currentBetFilter ===
        "loss"
    ) {
        return item.status === "Проиграла";
    }


    return true;
}


function changeBetFilter(value) {

    currentBetFilter =
        value;


    document
    .querySelectorAll(
        ".bet-filter"
    )
    .forEach(
        button => {

            button.classList.toggle(
                "active",
                button.dataset.filter
                ===
                value
            );
        }
    );


    renderBets();
}


function switchBetTab(type) {

    currentBetTab =
        type;


    document.getElementById(
        "singleTab"
    ).classList.toggle(
        "active",
        type === "single"
    );


    document.getElementById(
        "parlayTab"
    ).classList.toggle(
        "active",
        type === "parlay"
    );


    document.getElementById(
        "singleBets"
    ).style.display =
        type === "single"
        ?
        "block"
        :
        "none";


    document.getElementById(
        "parlayBets"
    ).style.display =
        type === "parlay"
        ?
        "block"
        :
        "none";
}


function renderBets() {

    const singles =
        bets.filter(
            passesBetFilter
        );


    document.getElementById(
        "singleBets"
    ).innerHTML =
        singles.length
        ?
        singles.map(
            bet => `
                <div class="card">

                    <span
                        class="
                            status
                            ${statusClass(
                                bet.status
                            )}
                        "
                    >
                        ${escapeHtml(
                            bet.status
                        )}
                    </span>

                    <h3>
                        ${escapeHtml(
                            bet.match
                        )}
                    </h3>

                    <div>
                        ${escapeHtml(
                            bet.selection
                        )}
                        •
                        ${Number(
                            bet.odd
                        ).toFixed(2)}
                    </div>

                    ${
                        bet.score
                        ?
                        `
                            <div class="notice">
                                Счёт:
                                ${escapeHtml(
                                    bet.score
                                )}
                            </div>
                        `
                        :
                        ""
                    }

                    <div class="notice">
                        Ставка:
                        ${bet.amount} 🪙
                    </div>

                    <div class="notice">
                        Возможный выигрыш:
                        ${bet.possible} 🪙
                    </div>

                </div>
            `
        ).join("")
        :
        `
            <div class="empty">
                Нет ставок
            </div>
        `;


    const express =
        parlays.filter(
            passesBetFilter
        );


    document.getElementById(
        "parlayBets"
    ).innerHTML =
        express.length
        ?
        express.map(
            parlay => `
                <div class="card">

                    <span
                        class="
                            status
                            ${statusClass(
                                parlay.status
                            )}
                        "
                    >
                        ${escapeHtml(
                            parlay.status
                        )}
                    </span>

                    <h3>
                        🧾 Экспресс #${parlay.id}
                    </h3>

                    <div class="notice">
                        Общий кэф:
                        ${Number(
                            parlay.total_odd
                        ).toFixed(2)}
                    </div>

                    <div class="notice">
                        Ставка:
                        ${parlay.amount} 🪙
                    </div>

                    <div class="notice">
                        Возможный выигрыш:
                        ${parlay.possible} 🪙
                    </div>

                    <h4>
                        События
                    </h4>

                    ${
                        (
                            parlay.legs
                            ||
                            []
                        )
                        .map(
                            (
                                leg,
                                index
                            ) => `
                                <div class="parlay-leg">

                                    <b>
                                        ${index + 1}.
                                        ${escapeHtml(
                                            leg.match
                                        )}
                                    </b>

                                    <div>
                                        ${escapeHtml(
                                            leg.selection
                                        )}
                                        •
                                        ${Number(
                                            leg.odd
                                        ).toFixed(2)}
                                    </div>

                                    ${
                                        leg.score
                                        ?
                                        `
                                            <div class="notice">
                                                Счёт:
                                                ${escapeHtml(
                                                    leg.score
                                                )}
                                            </div>
                                        `
                                        :
                                        ""
                                    }

                                    <span
                                        class="
                                            status
                                            ${statusClass(
                                                leg.status
                                            )}
                                        "
                                    >
                                        ${escapeHtml(
                                            leg.status
                                        )}
                                    </span>

                                </div>
                            `
                        )
                        .join("")
                    }

                </div>
            `
        ).join("")
        :
        `
            <div class="empty">
                Нет экспрессов
            </div>
        `;
}


async function loadLeaderboard() {

    try {

        const data =
            await post(
                "/api/leaderboard"
            );


        myRank =
            data.my_rank;


        document.getElementById(
            "leaderboard"
        ).innerHTML =
            (
                data.players
                ||
                []
            )
            .map(
                player => `
                    <div class="card">

                        <b>
                            #${player.rank}
                            ${escapeHtml(
                                player.first_name
                            )}
                        </b>

                        <div class="notice">
                            ${player.league?.icon || ""}
                            ${escapeHtml(
                                player.league?.name
                                ||
                                ""
                            )}
                            • Уровень
                            ${player.level}
                        </div>

                        <div>
                            ${player.xp} XP
                            •
                            ${player.balance} 🪙
                        </div>

                    </div>
                `
            )
            .join("");


        renderProfile();


    } catch(error) {

        console.error(error);
    }
}


function renderProfile() {

    document.getElementById(
        "profileName"
    ).textContent =
        currentUser?.first_name
        ||
        "Игрок";


    document.getElementById(
        "profileLeague"
    ).textContent =
        `${profileLeague.icon || ""} ${profileLeague.name || ""}`;


    document.getElementById(
        "profileLevel"
    ).textContent =
        `Уровень ${profileLevel}`;


    document.getElementById(
        "profileXp"
    ).textContent =
        `${profileXp} XP`;


    document.getElementById(
        "profileRank"
    ).textContent =
        myRank
        ?
        `Место: #${myRank}`
        :
        "Место: —";


    document.getElementById(
        "xpFill"
    ).style.width =
        `${Math.min(
            currentLevelXp,
            100
        )}%`;


    const statItems = [
        [
            profileStats.total_bets || 0,
            "Ординаров"
        ],

        [
            profileStats.wins || 0,
            "Побед"
        ],

        [
            `${profileStats.win_rate || 0}%`,
            "Процент побед"
        ],

        [
            profileStats.total_parlays || 0,
            "Экспрессов"
        ],

        [
            profileStats.net_profit || 0,
            "Профит 🪙"
        ],

        [
            profileStats.best_win_streak || 0,
            "Лучшая серия"
        ]
    ];


    document.getElementById(
        "stats"
    ).innerHTML =
        statItems.map(
            item => `
                <div class="stat">

                    <div class="stat-value">
                        ${item[0]}
                    </div>

                    <div class="stat-name">
                        ${item[1]}
                    </div>

                </div>
            `
        ).join("");


    document.getElementById(
        "tasks"
    ).innerHTML =
        tasks.map(
            task => `
                <div class="card task-row">

                    <div>

                        <b>
                            ${escapeHtml(
                                task.title
                            )}
                        </b>

                        <div class="notice">
                            ${task.progress}/${task.target}
                            •
                            +${task.reward}
                            ${
                                task.reward_type
                                ===
                                "xp"
                                ?
                                "XP"
                                :
                                "🪙"
                            }
                        </div>

                    </div>

                    <button
                        class="task-btn"

                        ${
                            !task.completed
                            ||
                            task.claimed
                            ?
                            "disabled"
                            :
                            ""
                        }

                        onclick="
                            claimTask(
                                '${jsString(task.key)}'
                            )
                        "
                    >
                        ${
                            task.claimed
                            ?
                            "Получено"
                            :
                            task.completed
                            ?
                            "Забрать"
                            :
                            "В процессе"
                        }
                    </button>

                </div>
            `
        ).join("");


    document.getElementById(
        "achievements"
    ).innerHTML =
        achievements.map(
            item => `
                <div class="card task-row">

                    <div>

                        <b>
                            ${escapeHtml(
                                item.title
                            )}
                        </b>

                        <div class="notice">
                            ${item.progress}/${item.target}
                            •
                            +${item.reward} 🪙
                        </div>

                    </div>

                    <button
                        class="task-btn"

                        ${
                            !item.completed
                            ||
                            item.claimed
                            ?
                            "disabled"
                            :
                            ""
                        }

                        onclick="
                            claimAchievement(
                                '${jsString(item.key)}'
                            )
                        "
                    >
                        ${
                            item.claimed
                            ?
                            "Получено"
                            :
                            item.completed
                            ?
                            "Забрать"
                            :
                            "Закрыто"
                        }
                    </button>

                </div>
            `
        ).join("");


    const dailyBtn =
        document.getElementById(
            "dailyBtn"
        );


    dailyBtn.disabled =
        !dailyReward.available;


    dailyBtn.textContent =
        dailyReward.available
        ?
        "Получить +300"
        :
        "Уже получено";


    if (
        !dailyReward.available
    ) {

        const seconds =
            Number(
                dailyReward.seconds_left
                ||
                0
            );


        const hours =
            Math.floor(
                seconds / 3600
            );


        const minutes =
            Math.floor(
                (
                    seconds % 3600
                )
                /
                60
            );


        document.getElementById(
            "dailyTimer"
        ).textContent =
            `Следующий бонус через ${hours} ч ${minutes} мин`;

    } else {

        document.getElementById(
            "dailyTimer"
        ).textContent =
            "Бонус доступен";
    }
}


async function claimDaily() {

    try {

        const data =
            await post(
                "/api/daily-reward"
            );


        balance =
            Number(
                data.balance
            );


        updateBalance();


        await loadSession();


        tg.showAlert(
            "+300 🪙 получено!"
        );


    } catch(error) {

        tg.showAlert(
            error.message
        );
    }
}


async function claimTask(key) {

    try {

        await post(
            "/api/tasks/claim",
            {
                task_key:key
            }
        );


        await loadSession();


    } catch(error) {

        tg.showAlert(
            error.message
        );
    }
}


async function claimAchievement(
    key
) {

    try {

        await post(
            "/api/achievements/claim",
            {
                achievement_key:key
            }
        );


        await loadSession();


    } catch(error) {

        tg.showAlert(
            error.message
        );
    }
}


function showPage(
    name,
    nav=true
) {

    document
    .querySelectorAll(
        ".page"
    )
    .forEach(
        page =>
            page.classList.remove(
                "active"
            )
    );


    document.getElementById(
        "page-" + name
    )
    ?.classList.add(
        "active"
    );


    if (nav) {

        document
        .querySelectorAll(
            ".nav"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "active"
                )
        );


        document.getElementById(
            "nav-" + name
        )
        ?.classList.add(
            "active"
        );
    }


    if (
        name ===
        "leaderboard"
    ) {

        loadLeaderboard();
    }


    if (
        name ===
        "profile"
        ||
        name ===
        "bets"
    ) {

        loadSession();
    }


    window.scrollTo(
        0,
        0
    );
}


async function init() {

    await Promise.all([
        loadSession(),
        loadLeague("top5")
    ]);


    await syncOldFavoriteMatches();

    await syncOldFavoriteTeams();


    renderMatches();
    renderHome();
    renderBets();
    renderProfile();
    renderFavoriteTeamsBox();


    loadLeaderboard();


    setInterval(
        async () => {

            try {

                const data =
                    await post(
                        "/api/settle"
                    );


                balance =
                    Number(
                        data.balance
                        ??
                        balance
                    );


                bets =
                    data.bets
                    ||
                    bets;


                parlays =
                    data.parlays
                    ||
                    parlays;


                profileStats =
                    data.stats
                    ||
                    profileStats;


                updateBalance();
                renderBets();


            } catch(error) {

                console.error(error);
            }

        },
        300000
    );
}


init();

</script>
