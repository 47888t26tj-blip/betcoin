<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BetCoin</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-bottom: 90px;
      background: #0b0d12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      padding: 18px;
      max-width: 600px;
      margin: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .balance-small {
      background: #191d27;
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: bold;
    }

    .balance-card {
      padding: 22px;
      border-radius: 22px;
      background: linear-gradient(135deg, #1f6feb, #6148d8);
      margin-bottom: 25px;
    }

    .balance-card p {
      margin: 0;
      opacity: 0.8;
    }

    .balance-card h1 {
      margin: 8px 0 0;
      font-size: 34px;
    }

    h2 {
      font-size: 21px;
    }

    .match {
      background: #161922;
      padding: 16px;
      border-radius: 18px;
      margin-bottom: 14px;
    }

    .league {
      color: #8d94a5;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .team {
      flex: 1;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .team img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      display: block;
      margin: 0 auto 7px;
    }

    .vs {
      color: #777f90;
      font-size: 12px;
    }

    .time {
      text-align: center;
      color: #9097a8;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .market-title {
      color: #a8afbd;
      font-size: 12px;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .team-total-title {
      color: white;
      font-size: 13px;
      font-weight: bold;
      margin: 12px 0 8px;
    }

    .odds-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .odds-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .odd-button {
      background: #232836;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 11px 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .odd-button:active {
      transform: scale(0.98);
    }

    .odd-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .no-odds {
      background: #20242f;
      color: #8e95a5;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 13px;
    }

    .bookmaker {
      color: #6f7788;
      font-size: 11px;
      margin-top: 10px;
      text-align: center;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #13161e;
      border-top: 1px solid #272b36;
      display: flex;
      justify-content: space-around;
      padding: 10px 5px 18px;
      z-index: 5;
    }

    .nav button {
      border: none;
      background: none;
      color: #858c9c;
      font-size: 12px;
    }

    .nav button.active {
      color: white;
    }

    .nav-icon {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .empty {
      background: #161922;
      border-radius: 18px;
      padding: 30px 20px;
      text-align: center;
      color: #9299a8;
    }

    .bet-card {
      background: #161922;
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .profile {
      background: #161922;
      padding: 22px;
      border-radius: 20px;
      text-align: center;
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #286cf4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 12px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #9299a8;
    }

    .modal {
      position: fixed;
      display: none;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1b1f2a;
      padding: 22px;
      border-radius: 25px 25px 0 0;
      z-index: 10;
    }

    .modal.active {
      display: block;
    }

    .overlay {
      position: fixed;
      display: none;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 9;
    }

    .overlay.active {
      display: block;
    }

    .modal input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: #292e3b;
      color: white;
      font-size: 18px;
      margin: 12px 0;
    }

    .confirm {
      width: 100%;
      background: #2775ff;
      border: none;
      color: white;
      padding: 15px;
      border-radius: 13px;
      font-size: 16px;
      font-weight: bold;
    }

    .cancel {
      width: 100%;
      margin-top: 8px;
      background: none;
      border: none;
      color: #999;
      padding: 10px;
    }

    .potential {
      color: #71df91;
      margin-bottom: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">⚽ BetCoin</div>

    <div class="balance-small">
      🪙 <span id="topBalance">1000</span>
    </div>
  </div>


  <div id="home" class="page active">

    <div class="balance-card">
      <p>Твой баланс</p>

      <h1>
        🪙 <span id="balance">1000</span>
      </h1>
    </div>

    <h2>🔥 Матчи</h2>

    <div id="homeMatches">
      <div class="loading">
        Загружаем матчи...
      </div>
    </div>

  </div>


  <div id="matches" class="page">

    <h2>⚽ Все матчи</h2>

    <div id="allMatches">
      <div class="loading">
        Загружаем матчи...
      </div>
    </div>

  </div>


  <div id="bets" class="page">

    <h2>🎫 Мои ставки</h2>

    <div id="betsList"></div>

  </div>


  <div id="profile" class="page">

    <h2>👤 Профиль</h2>

    <div class="profile">

      <div class="avatar">👤</div>

      <h2 id="playerName">Игрок</h2>

      <p>
        Баланс:
        🪙 <span id="profileBalance">1000</span>
      </p>

      <p>
        Сделано ставок:
        <span id="betsCount">0</span>
      </p>

    </div>

  </div>

</div>


<div class="nav">

  <button class="active" onclick="openPage('home', this)">
    <span class="nav-icon">🏠</span>
    Главная
  </button>

  <button onclick="openPage('matches', this)">
    <span class="nav-icon">⚽</span>
    Матчи
  </button>

  <button onclick="openPage('bets', this)">
    <span class="nav-icon">🎫</span>
    Ставки
  </button>

  <button onclick="openPage('profile', this)">
    <span class="nav-icon">👤</span>
    Профиль
  </button>

</div>


<div id="overlay" class="overlay" onclick="closeBet()"></div>


<div id="betModal" class="modal">

  <h2 id="modalMatch">Матч</h2>

  <p>
    Выбор:
    <b id="modalSelection"></b>
  </p>

  <p>
    Коэффициент:
    <b id="modalOdd"></b>
  </p>

  <input
    id="betAmount"
    type="number"
    placeholder="Сумма ставки"
    min="1"
    oninput="calculateWin()"
  >

  <div class="potential">
    Возможный выигрыш:
    🪙 <span id="possibleWin">0</span>
  </div>

  <button class="confirm" onclick="confirmBet()">
    Поставить
  </button>

  <button class="cancel" onclick="closeBet()">
    Отмена
  </button>

</div>


<script>

const SERVER_URL =
  "https://betcoin-gu5c.onrender.com";


const tg =
  window.Telegram.WebApp;

tg.ready();
tg.expand();


let balance =
  Number(
    localStorage.getItem(
      "betcoinBalance"
    )
  ) || 1000;


let bets =
  JSON.parse(
    localStorage.getItem(
      "betcoinBets"
    )
  ) || [];


let matches = [];
let selectedBet = null;


const HANDICAP_POINTS = [
  -2.5,
  -2,
  -1.5,
  -1,
  0,
  1,
  1.5,
  2,
  2.5
];


const TEAM_TOTAL_POINTS = [
  0.5,
  1.5,
  2.5,
  3.5
];


function formatDate(dateString) {

  const date =
    new Date(dateString);

  return date.toLocaleString(
    "ru-RU",
    {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


function safeMatchName(name) {

  return String(name)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");

}


function handicapKey(point) {

  if (Number.isInteger(point)) {
    return String(point);
  }

  return String(point);

}


function handicapLabel(point) {

  if (point > 0) {
    return `+${point}`;
  }

  return `${point}`;

}


function makeTotalBlock(
  match,
  fieldName,
  point,
  safeName
) {

  const total =
    match[fieldName];


  if (
    !total ||
    total.over == null ||
    total.under == null
  ) {

    return `
      <div class="no-odds">
        Тотал ${point} пока недоступен
      </div>
    `;

  }


  return `
    <div class="odds-2">

      <button
        class="odd-button"
        onclick="openBet(
          '${safeName}',
          'ТБ ${point}',
          ${total.over}
        )"
      >
        ТБ ${point}<br>
        ${Number(total.over).toFixed(2)}
      </button>

      <button
        class="odd-button"
        onclick="openBet(
          '${safeName}',
          'ТМ ${point}',
          ${total.under}
        )"
      >
        ТМ ${point}<br>
        ${Number(total.under).toFixed(2)}
      </button>

    </div>
  `;

}


function makeBttsBlock(
  match,
  safeName
) {

  if (
    !match.btts ||
    match.btts.yes == null ||
    match.btts.no == null
  ) {

    return `
      <div class="no-odds">
        ОЗ пока недоступен
      </div>
    `;

  }


  return `
    <div class="odds-2">

      <button
        class="odd-button"
        onclick="openBet(
          '${safeName}',
          'ОЗ Да',
          ${match.btts.yes}
        )"
      >
        ОЗ Да<br>
        ${Number(match.btts.yes).toFixed(2)}
      </button>

      <button
        class="odd-button"
        onclick="openBet(
          '${safeName}',
          'ОЗ Нет',
          ${match.btts.no}
        )"
      >
        ОЗ Нет<br>
        ${Number(match.btts.no).toFixed(2)}
      </button>

    </div>
  `;

}


function makeDoubleChanceBlock(
  match,
  safeName
) {

  if (!match.double_chance) {

    return `
      <div class="no-odds">
        Двойной шанс пока недоступен
      </div>
    `;

  }


  const oneX =
    match.double_chance["1x"];

  const oneTwo =
    match.double_chance["12"];

  const xTwo =
    match.double_chance["x2"];


  return `
    <div class="odds-3">

      <button
        class="odd-button"
        ${oneX == null ? "disabled" : ""}
        onclick="${
          oneX == null
            ? ""
            : `openBet('${safeName}', '1X', ${oneX})`
        }"
      >
        1X<br>
        ${
          oneX == null
            ? "—"
            : Number(oneX).toFixed(2)
        }
      </button>

      <button
        class="odd-button"
        ${oneTwo == null ? "disabled" : ""}
        onclick="${
          oneTwo == null
            ? ""
            : `openBet('${safeName}', '12', ${oneTwo})`
        }"
      >
        12<br>
        ${
          oneTwo == null
            ? "—"
            : Number(oneTwo).toFixed(2)
        }
      </button>

      <button
        class="odd-button"
        ${xTwo == null ? "disabled" : ""}
        onclick="${
          xTwo == null
            ? ""
            : `openBet('${safeName}', 'X2', ${xTwo})`
        }"
      >
        X2<br>
        ${
          xTwo == null
            ? "—"
            : Number(xTwo).toFixed(2)
        }
      </button>

    </div>
  `;

}


function makeHandicapsBlock(
  match,
  safeName
) {

  if (
    !match.handicaps ||
    !match.handicaps.home ||
    !match.handicaps.away
  ) {

    return `
      <div class="no-odds">
        Форы пока недоступны
      </div>
    `;

  }


  let html = "";


  HANDICAP_POINTS.forEach(
    homePoint => {

      const awayPoint =
        homePoint === 0
          ? 0
          : -homePoint;


      const homeKey =
        handicapKey(homePoint);

      const awayKey =
        handicapKey(awayPoint);


      const homeOdd =
        match.handicaps.home[
          homeKey
        ];

      const awayOdd =
        match.handicaps.away[
          awayKey
        ];


      const homeText =
        handicapLabel(
          homePoint
        );

      const awayText =
        handicapLabel(
          awayPoint
        );


      html += `
        <div class="odds-2">

          <button
            class="odd-button"
            ${homeOdd == null ? "disabled" : ""}
            onclick="${
              homeOdd == null
                ? ""
                : `openBet(
                    '${safeName}',
                    'Ф1(${homeText})',
                    ${homeOdd}
                  )`
            }"
          >
            Ф1(${homeText})<br>
            ${
              homeOdd == null
                ? "—"
                : Number(homeOdd).toFixed(2)
            }
          </button>


          <button
            class="odd-button"
            ${awayOdd == null ? "disabled" : ""}
            onclick="${
              awayOdd == null
                ? ""
                : `openBet(
                    '${safeName}',
                    'Ф2(${awayText})',
                    ${awayOdd}
                  )`
            }"
          >
            Ф2(${awayText})<br>
            ${
              awayOdd == null
                ? "—"
                : Number(awayOdd).toFixed(2)
            }
          </button>

        </div>
      `;

    }
  );


  return html;

}


function makeTeamTotalLines(
  totals,
  teamNumber,
  safeName
) {

  if (!totals) {

    return `
      <div class="no-odds">
        Индивидуальные тоталы пока недоступны
      </div>
    `;

  }


  let foundAnything = false;
  let html = "";


  TEAM_TOTAL_POINTS.forEach(
    point => {

      const key =
        String(point);


      const line =
        totals[key];


      const over =
        line?.over;

      const under =
        line?.under;


      if (
        over != null ||
        under != null
      ) {

        foundAnything = true;

      }


      html += `
        <div class="odds-2">

          <button
            class="odd-button"
            ${over == null ? "disabled" : ""}
            onclick="${
              over == null
                ? ""
                : `openBet(
                    '${safeName}',
                    'ИТБ${teamNumber}(${point})',
                    ${over}
                  )`
            }"
          >
            ИТБ${teamNumber}(${point})<br>
            ${
              over == null
                ? "—"
                : Number(over).toFixed(2)
            }
          </button>


          <button
            class="odd-button"
            ${under == null ? "disabled" : ""}
            onclick="${
              under == null
                ? ""
                : `openBet(
                    '${safeName}',
                    'ИТМ${teamNumber}(${point})',
                    ${under}
                  )`
            }"
          >
            ИТМ${teamNumber}(${point})<br>
            ${
              under == null
                ? "—"
                : Number(under).toFixed(2)
            }
          </button>

        </div>
      `;

    }
  );


  if (!foundAnything) {

    return `
      <div class="no-odds">
        Индивидуальные тоталы пока недоступны
      </div>
    `;

  }


  return html;

}


function makeTeamTotalsBlock(
  match,
  safeName
) {

  if (
    !match.team_totals ||
    !match.team_totals.home ||
    !match.team_totals.away
  ) {

    return `
      <div class="no-odds">
        Индивидуальные тоталы пока недоступны
      </div>
    `;

  }


  const homeBlock =
    makeTeamTotalLines(
      match.team_totals.home,
      1,
      safeName
    );


  const awayBlock =
    makeTeamTotalLines(
      match.team_totals.away,
      2,
      safeName
    );


  return `
    <div class="team-total-title">
      ${match.home}
    </div>

    ${homeBlock}


    <div class="team-total-title">
      ${match.away}
    </div>

    ${awayBlock}
  `;

}


function createMatch(match) {

  const matchName =
    `${match.home} — ${match.away}`;


  const safeName =
    safeMatchName(
      matchName
    );


  let mainOddsBlock = `
    <div class="no-odds">
      Основные коэффициенты пока недоступны
    </div>
  `;


  if (
    match.odds &&
    match.odds.home != null &&
    match.odds.draw != null &&
    match.odds.away != null
  ) {

    mainOddsBlock = `
      <div class="odds-3">

        <button
          class="odd-button"
          onclick="openBet(
            '${safeName}',
            'П1',
            ${match.odds.home}
          )"
        >
          П1<br>
          ${Number(match.odds.home).toFixed(2)}
        </button>

        <button
          class="odd-button"
          onclick="openBet(
            '${safeName}',
            'X',
            ${match.odds.draw}
          )"
        >
          X<br>
          ${Number(match.odds.draw).toFixed(2)}
        </button>

        <button
          class="odd-button"
          onclick="openBet(
            '${safeName}',
            'П2',
            ${match.odds.away}
          )"
        >
          П2<br>
          ${Number(match.odds.away).toFixed(2)}
        </button>

      </div>
    `;

  }


  const doubleChanceBlock =
    makeDoubleChanceBlock(
      match,
      safeName
    );


  const total15 =
    makeTotalBlock(
      match,
      "total_1_5",
      "1.5",
      safeName
    );


  const total25 =
    makeTotalBlock(
      match,
      "total_2_5",
      "2.5",
      safeName
    );


  const total35 =
    makeTotalBlock(
      match,
      "total_3_5",
      "3.5",
      safeName
    );


  const total45 =
    makeTotalBlock(
      match,
      "total_4_5",
      "4.5",
      safeName
    );


  const bttsBlock =
    makeBttsBlock(
      match,
      safeName
    );


  const handicapsBlock =
    makeHandicapsBlock(
      match,
      safeName
    );


  const teamTotalsBlock =
    makeTeamTotalsBlock(
      match,
      safeName
    );


  let sourceBlocks = "";


  if (match.bookmaker) {

    sourceBlocks += `
      <div class="bookmaker">
        Основные рынки:
        ${match.bookmaker}
      </div>
    `;

  }


  if (match.btts_bookmaker) {

    sourceBlocks += `
      <div class="bookmaker">
        ОЗ:
        ${match.btts_bookmaker}
      </div>
    `;

  }


  if (
    match.double_chance_bookmaker
  ) {

    sourceBlocks += `
      <div class="bookmaker">
        Двойной шанс:
        ${match.double_chance_bookmaker}
      </div>
    `;

  }


  if (
    match.handicaps_bookmaker
  ) {

    sourceBlocks += `
      <div class="bookmaker">
        Форы:
        ${match.handicaps_bookmaker}
      </div>
    `;

  }


  if (
    match.team_totals_bookmaker
  ) {

    sourceBlocks += `
      <div class="bookmaker">
        Инд. тоталы:
        ${match.team_totals_bookmaker}
      </div>
    `;

  }


  return `
    <div class="match">

      <div class="league">
        ${match.country}
        •
        ${match.league}
      </div>


      <div class="teams">

        <div class="team">

          <img
            src="${match.home_logo}"
          >

          ${match.home}

        </div>


        <div class="vs">
          VS
        </div>


        <div class="team">

          <img
            src="${match.away_logo}"
          >

          ${match.away}

        </div>

      </div>


      <div class="time">
        ${formatDate(
          match.date
        )}
      </div>


      <div class="market-title">
        Исход матча
      </div>

      ${mainOddsBlock}


      <div class="market-title">
        Двойной шанс
      </div>

      ${doubleChanceBlock}


      <div class="market-title">
        Тотал голов 1.5
      </div>

      ${total15}


      <div class="market-title">
        Тотал голов 2.5
      </div>

      ${total25}


      <div class="market-title">
        Тотал голов 3.5
      </div>

      ${total35}


      <div class="market-title">
        Тотал голов 4.5
      </div>

      ${total45}


      <div class="market-title">
        Обе забьют
      </div>

      ${bttsBlock}


      <div class="market-title">
        Форы
      </div>

      ${handicapsBlock}


      <div class="market-title">
        Индивидуальные тоталы
      </div>

      ${teamTotalsBlock}


      ${sourceBlocks}

    </div>
  `;

}


async function loadMatches() {

  try {

    const response =
      await fetch(
        `${SERVER_URL}/api/matches`
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        "API error"
      );

    }


    matches =
      data.matches || [];


    renderMatches();

  }

  catch (error) {

    document
      .getElementById(
        "homeMatches"
      )
      .innerHTML = `
        <div class="empty">
          Не удалось загрузить матчи
        </div>
      `;


    document
      .getElementById(
        "allMatches"
      )
      .innerHTML = `
        <div class="empty">
          Не удалось загрузить матчи
        </div>
      `;

  }

}


function renderMatches() {

  if (
    matches.length === 0
  ) {

    const text = `
      <div class="empty">
        Матчей пока нет
      </div>
    `;


    document
      .getElementById(
        "homeMatches"
      )
      .innerHTML = text;


    document
      .getElementById(
        "allMatches"
      )
      .innerHTML = text;


    return;

  }


  document
    .getElementById(
      "homeMatches"
    )
    .innerHTML = matches
      .slice(0, 4)
      .map(createMatch)
      .join("");


  document
    .getElementById(
      "allMatches"
    )
    .innerHTML = matches
      .map(createMatch)
      .join("");

}


function openBet(
  match,
  selection,
  odd
) {

  selectedBet = {
    match,
    selection,
    odd
  };


  document
    .getElementById(
      "modalMatch"
    )
    .innerText =
      match;


  document
    .getElementById(
      "modalSelection"
    )
    .innerText =
      selection;


  document
    .getElementById(
      "modalOdd"
    )
    .innerText =
      Number(
        odd
      ).toFixed(2);


  document
    .getElementById(
      "betAmount"
    )
    .value = "";


  document
    .getElementById(
      "possibleWin"
    )
    .innerText = "0";


  document
    .getElementById(
      "overlay"
    )
    .classList.add(
      "active"
    );


  document
    .getElementById(
      "betModal"
    )
    .classList.add(
      "active"
    );

}


function closeBet() {

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "active"
    );


  document
    .getElementById(
      "betModal"
    )
    .classList.remove(
      "active"
    );

}


function calculateWin() {

  if (!selectedBet) {
    return;
  }


  const amount =
    Number(
      document
        .getElementById(
          "betAmount"
        )
        .value
    );


  const win =
    amount *
    selectedBet.odd;


  document
    .getElementById(
      "possibleWin"
    )
    .innerText =
      win
        ? win.toFixed(0)
        : 0;

}


function confirmBet() {

  const amount =
    Number(
      document
        .getElementById(
          "betAmount"
        )
        .value
    );


  if (
    !amount ||
    amount <= 0
  ) {

    alert(
      "Введите сумму ставки"
    );

    return;

  }


  if (
    amount > balance
  ) {

    alert(
      "Недостаточно монет"
    );

    return;

  }


  balance -= amount;


  bets.unshift({

    match:
      selectedBet.match,

    selection:
      selectedBet.selection,

    odd:
      selectedBet.odd,

    amount:
      amount,

    possible:
      Math.round(
        amount *
        selectedBet.odd
      ),

    status:
      "Активна"

  });


  saveData();

  updateInterface();

  closeBet();


  if (
    tg.HapticFeedback
  ) {

    tg.HapticFeedback
      .notificationOccurred(
        "success"
      );

  }

}


function saveData() {

  localStorage.setItem(
    "betcoinBalance",
    balance
  );


  localStorage.setItem(
    "betcoinBets",
    JSON.stringify(
      bets
    )
  );

}


function renderBets() {

  const list =
    document.getElementById(
      "betsList"
    );


  if (
    bets.length === 0
  ) {

    list.innerHTML = `
      <div class="empty">
        У тебя пока нет ставок
      </div>
    `;

    return;

  }


  list.innerHTML =
    bets.map(
      bet => `
        <div class="bet-card">

          <b>
            ${bet.match}
          </b>

          <p>
            ${bet.selection}
            •
            ${Number(
              bet.odd
            ).toFixed(2)}
          </p>

          <p>
            Ставка:
            🪙 ${bet.amount}
          </p>

          <p>
            Возможный выигрыш:
            🪙 ${bet.possible}
          </p>

          <p>
            ⏳ ${bet.status}
          </p>

        </div>
      `
    ).join("");

}


function updateInterface() {

  document
    .getElementById(
      "balance"
    )
    .innerText =
      balance;


  document
    .getElementById(
      "topBalance"
    )
    .innerText =
      balance;


  document
    .getElementById(
      "profileBalance"
    )
    .innerText =
      balance;


  document
    .getElementById(
      "betsCount"
    )
    .innerText =
      bets.length;


  renderBets();

}


function openPage(
  page,
  button
) {

  document
    .querySelectorAll(
      ".page"
    )
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  document
    .getElementById(
      page
    )
    .classList.add(
      "active"
    );


  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  button.classList.add(
    "active"
  );

}


const user =
  tg.initDataUnsafe?.user;


if (user) {

  document
    .getElementById(
      "playerName"
    )
    .innerText =
      user.first_name ||
      "Игрок";

}


updateInterface();
loadMatches();

</script>

</body>
</html>
