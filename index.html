<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BetCoin</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-bottom: 90px;
      background: #0b0d12;
      color: white;
      font-family: Arial, sans-serif;
    }

    button {
      font-family: inherit;
    }

    .container {
      padding: 18px;
      max-width: 600px;
      margin: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .balance-small {
      background: #191d27;
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: bold;
    }

    .balance-card {
      padding: 22px;
      border-radius: 22px;
      background: linear-gradient(135deg, #1f6feb, #6148d8);
      margin-bottom: 25px;
    }

    .balance-card p {
      margin: 0;
      opacity: 0.8;
    }

    .balance-card h1 {
      margin: 8px 0 0;
      font-size: 34px;
    }

    h2 {
      font-size: 21px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* =========================
       КОМПАКТНАЯ КАРТОЧКА МАТЧА
       ========================= */

    .match-card {
      background: #161922;
      padding: 16px;
      border-radius: 18px;
      margin-bottom: 14px;
    }

    .league {
      color: #8d94a5;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .team {
      flex: 1;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .team img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      display: block;
      margin: 0 auto 7px;
    }

    .vs {
      color: #777f90;
      font-size: 12px;
    }

    .time {
      text-align: center;
      color: #9097a8;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .odds-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .odds-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .odd-button {
      background: #232836;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 11px 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .odd-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .odd-button:active {
      transform: scale(0.98);
    }

    .open-match-button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: none;
      border-radius: 13px;
      background: #2775ff;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* =========================
       ЭКРАН ОТДЕЛЬНОГО МАТЧА
       ========================= */

    .back-button {
      background: #191d27;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .event-header {
      background: #161922;
      padding: 20px 16px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .event-header .teams {
      margin-top: 16px;
    }

    .event-header .team img {
      width: 58px;
      height: 58px;
    }

    .market-box {
      background: #161922;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .market-title {
      color: white;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .team-total-title {
      color: #aeb5c4;
      font-size: 13px;
      font-weight: bold;
      margin: 12px 0 8px;
    }

    .no-odds {
      background: #20242f;
      color: #8e95a5;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 13px;
    }

    .bookmaker {
      color: #6f7788;
      font-size: 11px;
      margin-top: 10px;
      text-align: center;
    }

    /* =========================
       НАВИГАЦИЯ
       ========================= */

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #13161e;
      border-top: 1px solid #272b36;
      display: flex;
      justify-content: space-around;
      padding: 10px 5px 18px;
      z-index: 5;
    }

    .nav button {
      border: none;
      background: none;
      color: #858c9c;
      font-size: 12px;
    }

    .nav button.active {
      color: white;
    }

    .nav-icon {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    /* =========================
       СТАВКИ / ПРОФИЛЬ
       ========================= */

    .empty {
      background: #161922;
      border-radius: 18px;
      padding: 30px 20px;
      text-align: center;
      color: #9299a8;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #9299a8;
    }

    .bet-card {
      background: #161922;
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .profile {
      background: #161922;
      padding: 22px;
      border-radius: 20px;
      text-align: center;
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #286cf4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 12px;
    }

    /* =========================
       ОКНО СТАВКИ
       ========================= */

    .overlay {
      position: fixed;
      display: none;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 9;
    }

    .overlay.active {
      display: block;
    }

    .modal {
      position: fixed;
      display: none;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1b1f2a;
      padding: 22px;
      border-radius: 25px 25px 0 0;
      z-index: 10;
    }

    .modal.active {
      display: block;
    }

    .modal input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: #292e3b;
      color: white;
      font-size: 18px;
      margin: 12px 0;
    }

    .confirm {
      width: 100%;
      background: #2775ff;
      border: none;
      color: white;
      padding: 15px;
      border-radius: 13px;
      font-size: 16px;
      font-weight: bold;
    }

    .cancel {
      width: 100%;
      margin-top: 8px;
      background: none;
      border: none;
      color: #999;
      padding: 10px;
    }

    .potential {
      color: #71df91;
      margin-bottom: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">⚽ BetCoin</div>

    <div class="balance-small">
      🪙 <span id="topBalance">1000</span>
    </div>
  </div>


  <!-- ГЛАВНАЯ -->
  <div id="home" class="page active">

    <div class="balance-card">
      <p>Твой баланс</p>

      <h1>
        🪙 <span id="balance">1000</span>
      </h1>
    </div>

    <h2>🔥 Матчи</h2>

    <div id="homeMatches">
      <div class="loading">
        Загружаем матчи...
      </div>
    </div>

  </div>


  <!-- ВСЕ МАТЧИ -->
  <div id="matches" class="page">

    <h2>⚽ Все матчи</h2>

    <div id="allMatches">
      <div class="loading">
        Загружаем матчи...
      </div>
    </div>

  </div>


  <!-- ОТДЕЛЬНЫЙ МАТЧ -->
  <div id="matchDetail" class="page">

    <button
      class="back-button"
      onclick="closeMatch()"
    >
      ← Назад
    </button>

    <div id="matchDetailContent"></div>

  </div>


  <!-- МОИ СТАВКИ -->
  <div id="bets" class="page">

    <h2>🎫 Мои ставки</h2>

    <div id="betsList"></div>

  </div>


  <!-- ПРОФИЛЬ -->
  <div id="profile" class="page">

    <h2>👤 Профиль</h2>

    <div class="profile">

      <div class="avatar">
        👤
      </div>

      <h2 id="playerName">
        Игрок
      </h2>

      <p>
        Баланс:
        🪙 <span id="profileBalance">1000</span>
      </p>

      <p>
        Сделано ставок:
        <span id="betsCount">0</span>
      </p>

    </div>

  </div>

</div>


<!-- НИЖНЕЕ МЕНЮ -->
<div class="nav">

  <button
    class="active"
    onclick="openPage('home', this)"
  >
    <span class="nav-icon">🏠</span>
    Главная
  </button>

  <button
    onclick="openPage('matches', this)"
  >
    <span class="nav-icon">⚽</span>
    Матчи
  </button>

  <button
    onclick="openPage('bets', this)"
  >
    <span class="nav-icon">🎫</span>
    Ставки
  </button>

  <button
    onclick="openPage('profile', this)"
  >
    <span class="nav-icon">👤</span>
    Профиль
  </button>

</div>


<!-- ОКНО СТАВКИ -->

<div
  id="overlay"
  class="overlay"
  onclick="closeBet()"
></div>


<div
  id="betModal"
  class="modal"
>

  <h2 id="modalMatch">
    Матч
  </h2>

  <p>
    Выбор:
    <b id="modalSelection"></b>
  </p>

  <p>
    Коэффициент:
    <b id="modalOdd"></b>
  </p>

  <input
    id="betAmount"
    type="number"
    placeholder="Сумма ставки"
    min="1"
    oninput="calculateWin()"
  >

  <div class="potential">
    Возможный выигрыш:
    🪙 <span id="possibleWin">0</span>
  </div>

  <button
    class="confirm"
    onclick="confirmBet()"
  >
    Поставить
  </button>

  <button
    class="cancel"
    onclick="closeBet()"
  >
    Отмена
  </button>

</div>


<script>

const SERVER_URL =
  "https://betcoin-gu5c.onrender.com";


const tg =
  window.Telegram.WebApp;

tg.ready();
tg.expand();


let balance =
  Number(
    localStorage.getItem(
      "betcoinBalance"
    )
  ) || 1000;


let bets =
  JSON.parse(
    localStorage.getItem(
      "betcoinBets"
    )
  ) || [];


let matches = [];

let selectedBet = null;

let selectedMatch = null;

let previousPage = "home";


const HANDICAP_POINTS = [
  -2.5,
  -2,
  -1.5,
  -1,
  0,
  1,
  1.5,
  2,
  2.5
];


const TEAM_TOTAL_POINTS = [
  0.5,
  1.5,
  2.5,
  3.5
];


function formatDate(dateString) {

  const date =
    new Date(dateString);

  return date.toLocaleString(
    "ru-RU",
    {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


function safeMatchName(name) {

  return String(name)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");

}


function handicapLabel(point) {

  if (point > 0) {
    return `+${point}`;
  }

  return `${point}`;

}


function handicapKey(point) {

  return String(point);

}


/* =========================
   КОМПАКТНАЯ КАРТОЧКА
   ========================= */

function createCompactMatch(
  match,
  index
) {

  let oddsBlock = `
    <div class="no-odds">
      Коэффициенты пока недоступны
    </div>
  `;


  if (
    match.odds &&
    match.odds.home != null &&
    match.odds.draw != null &&
    match.odds.away != null
  ) {

    const safeName =
      safeMatchName(
        `${match.home} — ${match.away}`
      );


    oddsBlock = `
      <div class="odds-3">

        <button
          class="odd-button"
          onclick="
            event.stopPropagation();
            openBet(
              '${safeName}',
              'П1',
              ${match.odds.home}
            )
          "
        >
          П1<br>
          ${Number(match.odds.home).toFixed(2)}
        </button>


        <button
          class="odd-button"
          onclick="
            event.stopPropagation();
            openBet(
              '${safeName}',
              'X',
              ${match.odds.draw}
            )
          "
        >
          X<br>
          ${Number(match.odds.draw).toFixed(2)}
        </button>


        <button
          class="odd-button"
          onclick="
            event.stopPropagation();
            openBet(
              '${safeName}',
              'П2',
              ${match.odds.away}
            )
          "
        >
          П2<br>
          ${Number(match.odds.away).toFixed(2)}
        </button>

      </div>
    `;

  }


  return `
    <div class="match-card">

      <div class="league">
        ${match.country}
        •
        ${match.league}
      </div>


      <div class="teams">

        <div class="team">
          <img src="${match.home_logo}">
          ${match.home}
        </div>

        <div class="vs">
          VS
        </div>

        <div class="team">
          <img src="${match.away_logo}">
          ${match.away}
        </div>

      </div>


      <div class="time">
        ${formatDate(match.date)}
      </div>


      ${oddsBlock}


      <button
        class="open-match-button"
        onclick="openMatch(${index})"
      >
        Открыть матч →
      </button>

    </div>
  `;

}


/* =========================
   РЫНКИ
   ========================= */

function makeMainOdds(
  match,
  safeName
) {

  if (
    !match.odds ||
    match.odds.home == null ||
    match.odds.draw == null ||
    match.odds.away == null
  ) {

    return `
      <div class="no-odds">
        Исход матча пока недоступен
      </div>
    `;

  }


  return `
    <div class="odds-3">

      <button
        class="odd-button"
        onclick="openBet(
          '${safeName}',
          'П1',
          ${match.odds.home}
        )"
      >
        П1<br>
        ${Number(match.odds.home).toFixed(2)}
      </button>


      <button
        class="odd-button"
        onclick="openBet(
          '${safeName}',
          'X',
          ${match.odds.draw}
        )"
      >
        X<br>
        ${Number(match.odds.draw).toFixed(2)}
      </button>


      <button
        class="odd-button"
        onclick="openBet(
          '${safeName}',
          'П2',
          ${match.odds.away}
        )"
      >
        П2<br>
        ${Number(match.odds.away).toFixed(2)}
      </button>

    </div>
  `;

}


function makeDoubleChanceBlock(
  match,
  safeName
) {

  if (!match.double_chance) {

    return `
      <div class="no-odds">
        Двойной шанс пока недоступен
      </div>
    `;

  }


  const oneX =
    match.double_chance["1x"];

  const oneTwo =
    match.double_chance["12"];

  const xTwo =
    match.double_chance["x2"];


  return `
    <div class="odds-3">

      <button
        class="odd-button"
        ${oneX == null ? "disabled" : ""}
        onclick="${
          oneX == null
            ? ""
            : `openBet('${safeName}', '1X', ${oneX})`
        }"
      >
        1X<br>
        ${
          oneX == null
            ? "—"
            : Number(oneX).toFixed(2)
        }
      </button>


      <button
        class="odd-button"
        ${oneTwo == null ? "disabled" : ""}
        onclick="${
          oneTwo == null
            ? ""
            : `openBet('${safeName}', '12', ${oneTwo})`
        }"
      >
        12<br>
        ${
          oneTwo == null
            ? "—"
            : Number(oneTwo).toFixed(2)
        }
      </button>


      <button
        class="odd-button"
        ${xTwo == null ? "disabled" : ""}
        onclick="${
          xTwo == null
            ? ""
            : `openBet('${safeName}', 'X2', ${xTwo})`
        }"
      >
        X2<br>
        ${
          xTwo == null
            ? "—"
            : Number(xTwo).toFixed(2)
        }
      </button>

    </div>
  `;

}


function makeTotalBlock(
  match,
  fieldName,
  point,
  safeName
) {

  const total =
    match[fieldName];


  if (
    !total ||
    total.over == null ||
    total.under == null
  ) {

    return `
      <div class="no-odds">
        Тотал ${point} пока недоступен
      </div>
    `;

  }


  return `
    <div class="odds-2">

      <button
        class="odd-button"
        onclick="openBet(
          '${safeName}',
          'ТБ ${point}',
          ${total.over}
        )"
      >
        ТБ ${point}<br>
        ${Number(total.over).toFixed(2)}
      </button>


      <button
        class="odd-button"
        onclick="openBet(
          '${safeName}',
          'ТМ ${point}',
          ${total.under}
        )"
      >
        ТМ ${point}<br>
        ${Number(total.under).toFixed(2)}
      </button>

    </div>
  `;

}


function makeBttsBlock(
  match,
  safeName
) {

  if (
    !match.btts ||
    match.btts.yes == null ||
    match.btts.no == null
  ) {

    return `
      <div class="no-odds">
        ОЗ пока недоступен
      </div>
    `;

  }


  return `
    <div class="odds-2">

      <button
        class="odd-button"
        onclick="openBet(
          '${safeName}',
          'ОЗ Да',
          ${match.btts.yes}
        )"
      >
        ОЗ Да<br>
        ${Number(match.btts.yes).toFixed(2)}
      </button>


      <button
        class="odd-button"
        onclick="openBet(
          '${safeName}',
          'ОЗ Нет',
          ${match.btts.no}
        )"
      >
        ОЗ Нет<br>
        ${Number(match.btts.no).toFixed(2)}
      </button>

    </div>
  `;

}


function makeHandicapsBlock(
  match,
  safeName
) {

  if (
    !match.handicaps ||
    !match.handicaps.home ||
    !match.handicaps.away
  ) {

    return `
      <div class="no-odds">
        Форы пока недоступны
      </div>
    `;

  }


  let html = "";


  HANDICAP_POINTS.forEach(
    homePoint => {

      const awayPoint =
        homePoint === 0
          ? 0
          : -homePoint;


      const homeOdd =
        match.handicaps.home[
          handicapKey(homePoint)
        ];


      const awayOdd =
        match.handicaps.away[
          handicapKey(awayPoint)
        ];


      const homeLabel =
        handicapLabel(
          homePoint
        );


      const awayLabel =
        handicapLabel(
          awayPoint
        );


      html += `
        <div class="odds-2">

          <button
            class="odd-button"
            ${homeOdd == null ? "disabled" : ""}
            onclick="${
              homeOdd == null
                ? ""
                : `openBet(
                    '${safeName}',
                    'Ф1(${homeLabel})',
                    ${homeOdd}
                  )`
            }"
          >
            Ф1(${homeLabel})<br>
            ${
              homeOdd == null
                ? "—"
                : Number(homeOdd).toFixed(2)
            }
          </button>


          <button
            class="odd-button"
            ${awayOdd == null ? "disabled" : ""}
            onclick="${
              awayOdd == null
                ? ""
                : `openBet(
                    '${safeName}',
                    'Ф2(${awayLabel})',
                    ${awayOdd}
                  )`
            }"
          >
            Ф2(${awayLabel})<br>
            ${
              awayOdd == null
                ? "—"
                : Number(awayOdd).toFixed(2)
            }
          </button>

        </div>
      `;

    }
  );


  return html;

}


function makeTeamTotalLines(
  totals,
  teamNumber,
  safeName
) {

  if (!totals) {

    return `
      <div class="no-odds">
        Индивидуальные тоталы пока недоступны
      </div>
    `;

  }


  let found = false;

  let html = "";


  TEAM_TOTAL_POINTS.forEach(
    point => {

      const line =
        totals[String(point)];


      const over =
        line?.over;

      const under =
        line?.under;


      if (
        over != null ||
        under != null
      ) {
        found = true;
      }


      html += `
        <div class="odds-2">

          <button
            class="odd-button"
            ${over == null ? "disabled" : ""}
            onclick="${
              over == null
                ? ""
                : `openBet(
                    '${safeName}',
                    'ИТБ${teamNumber}(${point})',
                    ${over}
                  )`
            }"
          >
            ИТБ${teamNumber}(${point})<br>
            ${
              over == null
                ? "—"
                : Number(over).toFixed(2)
            }
          </button>


          <button
            class="odd-button"
            ${under == null ? "disabled" : ""}
            onclick="${
              under == null
                ? ""
                : `openBet(
                    '${safeName}',
                    'ИТМ${teamNumber}(${point})',
                    ${under}
                  )`
            }"
          >
            ИТМ${teamNumber}(${point})<br>
            ${
              under == null
                ? "—"
                : Number(under).toFixed(2)
            }
          </button>

        </div>
      `;

    }
  );


  if (!found) {

    return `
      <div class="no-odds">
        Индивидуальные тоталы пока недоступны
      </div>
    `;

  }


  return html;

}


function makeTeamTotalsBlock(
  match,
  safeName
) {

  if (
    !match.team_totals ||
    !match.team_totals.home ||
    !match.team_totals.away
  ) {

    return `
      <div class="no-odds">
        Индивидуальные тоталы пока недоступны
      </div>
    `;

  }


  return `

    <div class="team-total-title">
      ${match.home}
    </div>

    ${makeTeamTotalLines(
      match.team_totals.home,
      1,
      safeName
    )}


    <div class="team-total-title">
      ${match.away}
    </div>

    ${makeTeamTotalLines(
      match.team_totals.away,
      2,
      safeName
    )}

  `;

}


/* =========================
   ОТКРЫТИЕ МАТЧА
   ========================= */

function openMatch(index) {

  selectedMatch =
    matches[index];


  if (!selectedMatch) {
    return;
  }


  if (
    document
      .getElementById("matches")
      .classList
      .contains("active")
  ) {

    previousPage =
      "matches";

  } else {

    previousPage =
      "home";

  }


  renderMatchDetail(
    selectedMatch
  );


  document
    .querySelectorAll(".page")
    .forEach(
      page =>
        page.classList.remove(
          "active"
        )
    );


  document
    .getElementById(
      "matchDetail"
    )
    .classList.add(
      "active"
    );


  window.scrollTo(
    0,
    0
  );

}


function closeMatch() {

  document
    .querySelectorAll(".page")
    .forEach(
      page =>
        page.classList.remove(
          "active"
        )
    );


  document
    .getElementById(
      previousPage
    )
    .classList.add(
      "active"
    );


  updateNavForPage(
    previousPage
  );


  window.scrollTo(
    0,
    0
  );

}


/* =========================
   СТРАНИЦА МАТЧА
   ========================= */

function renderMatchDetail(match) {

  const matchName =
    `${match.home} — ${match.away}`;


  const safeName =
    safeMatchName(
      matchName
    );


  const mainOdds =
    makeMainOdds(
      match,
      safeName
    );


  const doubleChance =
    makeDoubleChanceBlock(
      match,
      safeName
    );


  const total15 =
    makeTotalBlock(
      match,
      "total_1_5",
      "1.5",
      safeName
    );


  const total25 =
    makeTotalBlock(
      match,
      "total_2_5",
      "2.5",
      safeName
    );


  const total35 =
    makeTotalBlock(
      match,
      "total_3_5",
      "3.5",
      safeName
    );


  const total45 =
    makeTotalBlock(
      match,
      "total_4_5",
      "4.5",
      safeName
    );


  const btts =
    makeBttsBlock(
      match,
      safeName
    );


  const handicaps =
    makeHandicapsBlock(
      match,
      safeName
    );


  const teamTotals =
    makeTeamTotalsBlock(
      match,
      safeName
    );


  let sources = "";


  if (match.bookmaker) {

    sources += `
      <div class="bookmaker">
        Основные рынки:
        ${match.bookmaker}
      </div>
    `;

  }


  if (match.btts_bookmaker) {

    sources += `
      <div class="bookmaker">
        ОЗ:
        ${match.btts_bookmaker}
      </div>
    `;

  }


  if (
    match.double_chance_bookmaker
  ) {

    sources += `
      <div class="bookmaker">
        Двойной шанс:
        ${match.double_chance_bookmaker}
      </div>
    `;

  }


  if (
    match.handicaps_bookmaker
  ) {

    sources += `
      <div class="bookmaker">
        Форы:
        ${match.handicaps_bookmaker}
      </div>
    `;

  }


  if (
    match.team_totals_bookmaker
  ) {

    sources += `
      <div class="bookmaker">
        Инд. тоталы:
        ${match.team_totals_bookmaker}
      </div>
    `;

  }


  document
    .getElementById(
      "matchDetailContent"
    )
    .innerHTML = `


      <div class="event-header">

        <div class="league">
          ${match.country}
          •
          ${match.league}
        </div>


        <div class="teams">

          <div class="team">

            <img
              src="${match.home_logo}"
            >

            ${match.home}

          </div>


          <div class="vs">
            VS
          </div>


          <div class="team">

            <img
              src="${match.away_logo}"
            >

            ${match.away}

          </div>

        </div>


        <div class="time">
          ${formatDate(
            match.date
          )}
        </div>

      </div>


      <div class="market-box">

        <div class="market-title">
          Исход матча
        </div>

        ${mainOdds}

      </div>


      <div class="market-box">

        <div class="market-title">
          Двойной шанс
        </div>

        ${doubleChance}

      </div>


      <div class="market-box">

        <div class="market-title">
          Тотал голов 1.5
        </div>

        ${total15}

      </div>


      <div class="market-box">

        <div class="market-title">
          Тотал голов 2.5
        </div>

        ${total25}

      </div>


      <div class="market-box">

        <div class="market-title">
          Тотал голов 3.5
        </div>

        ${total35}

      </div>


      <div class="market-box">

        <div class="market-title">
          Тотал голов 4.5
        </div>

        ${total45}

      </div>


      <div class="market-box">

        <div class="market-title">
          Обе забьют
        </div>

        ${btts}

      </div>


      <div class="market-box">

        <div class="market-title">
          Форы
        </div>

        ${handicaps}

      </div>


      <div class="market-box">

        <div class="market-title">
          Индивидуальные тоталы
        </div>

        ${teamTotals}

      </div>


      <div class="market-box">
        ${sources}
      </div>

  `;

}


/* =========================
   ЗАГРУЗКА МАТЧЕЙ
   ========================= */

async function loadMatches() {

  try {

    const response =
      await fetch(
        `${SERVER_URL}/api/matches`
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        "API error"
      );

    }


    matches =
      data.matches || [];


    renderMatches();

  }

  catch (error) {

    document
      .getElementById(
        "homeMatches"
      )
      .innerHTML = `
        <div class="empty">
          Не удалось загрузить матчи
        </div>
      `;


    document
      .getElementById(
        "allMatches"
      )
      .innerHTML = `
        <div class="empty">
          Не удалось загрузить матчи
        </div>
      `;

  }

}


function renderMatches() {

  if (
    matches.length === 0
  ) {

    const text = `
      <div class="empty">
        Матчей пока нет
      </div>
    `;


    document
      .getElementById(
        "homeMatches"
      )
      .innerHTML = text;


    document
      .getElementById(
        "allMatches"
      )
      .innerHTML = text;


    return;

  }


  document
    .getElementById(
      "homeMatches"
    )
    .innerHTML =
      matches
        .slice(0, 4)
        .map(
          match => {
            const index =
              matches.indexOf(
                match
              );

            return createCompactMatch(
              match,
              index
            );
          }
        )
        .join("");


  document
    .getElementById(
      "allMatches"
    )
    .innerHTML =
      matches
        .map(
          (
            match,
            index
          ) =>
            createCompactMatch(
              match,
              index
            )
        )
        .join("");

}


/* =========================
   СТАВКА
   ========================= */

function openBet(
  match,
  selection,
  odd
) {

  if (
    odd == null
  ) {
    return;
  }


  selectedBet = {
    match,
    selection,
    odd
  };


  document
    .getElementById(
      "modalMatch"
    )
    .innerText =
      match;


  document
    .getElementById(
      "modalSelection"
    )
    .innerText =
      selection;


  document
    .getElementById(
      "modalOdd"
    )
    .innerText =
      Number(
        odd
      ).toFixed(2);


  document
    .getElementById(
      "betAmount"
    )
    .value = "";


  document
    .getElementById(
      "possibleWin"
    )
    .innerText = "0";


  document
    .getElementById(
      "overlay"
    )
    .classList.add(
      "active"
    );


  document
    .getElementById(
      "betModal"
    )
    .classList.add(
      "active"
    );

}


function closeBet() {

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "active"
    );


  document
    .getElementById(
      "betModal"
    )
    .classList.remove(
      "active"
    );

}


function calculateWin() {

  if (!selectedBet) {
    return;
  }


  const amount =
    Number(
      document
        .getElementById(
          "betAmount"
        )
        .value
    );


  const win =
    amount *
    selectedBet.odd;


  document
    .getElementById(
      "possibleWin"
    )
    .innerText =
      win
        ? win.toFixed(0)
        : 0;

}


function confirmBet() {

  if (!selectedBet) {
    return;
  }


  const amount =
    Number(
      document
        .getElementById(
          "betAmount"
        )
        .value
    );


  if (
    !amount ||
    amount <= 0
  ) {

    alert(
      "Введите сумму ставки"
    );

    return;

  }


  if (
    amount > balance
  ) {

    alert(
      "Недостаточно монет"
    );

    return;

  }


  balance -= amount;


  bets.unshift({

    match:
      selectedBet.match,

    selection:
      selectedBet.selection,

    odd:
      selectedBet.odd,

    amount:
      amount,

    possible:
      Math.round(
        amount *
        selectedBet.odd
      ),

    status:
      "Активна"

  });


  saveData();

  updateInterface();

  closeBet();


  if (
    tg.HapticFeedback
  ) {

    tg.HapticFeedback
      .notificationOccurred(
        "success"
      );

  }

}


/* =========================
   ХРАНЕНИЕ
   ========================= */

function saveData() {

  localStorage.setItem(
    "betcoinBalance",
    balance
  );


  localStorage.setItem(
    "betcoinBets",
    JSON.stringify(
      bets
    )
  );

}


/* =========================
   МОИ СТАВКИ
   ========================= */

function renderBets() {

  const list =
    document.getElementById(
      "betsList"
    );


  if (
    bets.length === 0
  ) {

    list.innerHTML = `
      <div class="empty">
        У тебя пока нет ставок
      </div>
    `;

    return;

  }


  list.innerHTML =
    bets.map(
      bet => `
        <div class="bet-card">

          <b>
            ${bet.match}
          </b>

          <p>
            ${bet.selection}
            •
            ${Number(
              bet.odd
            ).toFixed(2)}
          </p>

          <p>
            Ставка:
            🪙 ${bet.amount}
          </p>

          <p>
            Возможный выигрыш:
            🪙 ${bet.possible}
          </p>

          <p>
            ⏳ ${bet.status}
          </p>

        </div>
      `
    ).join("");

}


/* =========================
   ИНТЕРФЕЙС
   ========================= */

function updateInterface() {

  document
    .getElementById(
      "balance"
    )
    .innerText =
      balance;


  document
    .getElementById(
      "topBalance"
    )
    .innerText =
      balance;


  document
    .getElementById(
      "profileBalance"
    )
    .innerText =
      balance;


  document
    .getElementById(
      "betsCount"
    )
    .innerText =
      bets.length;


  renderBets();

}


function openPage(
  page,
  button
) {

  document
    .querySelectorAll(
      ".page"
    )
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  document
    .getElementById(
      page
    )
    .classList.add(
      "active"
    );


  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  button.classList.add(
    "active"
  );


  window.scrollTo(
    0,
    0
  );

}


function updateNavForPage(
  page
) {

  const buttons =
    document.querySelectorAll(
      ".nav button"
    );


  buttons.forEach(
    button =>
      button.classList.remove(
        "active"
      )
  );


  if (page === "home") {
    buttons[0].classList.add(
      "active"
    );
  }

  if (page === "matches") {
    buttons[1].classList.add(
      "active"
    );
  }

  if (page === "bets") {
    buttons[2].classList.add(
      "active"
    );
  }

  if (page === "profile") {
    buttons[3].classList.add(
      "active"
    );
  }

}


/* =========================
   TELEGRAM USER
   ========================= */

const user =
  tg.initDataUnsafe?.user;


if (user) {

  document
    .getElementById(
      "playerName"
    )
    .innerText =
      user.first_name ||
      "Игрок";

}


/* =========================
   СТАРТ
   ========================= */

updateInterface();

loadMatches();

</script>
